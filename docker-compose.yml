services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:2.27.2-pg16
    restart: unless-stopped
    # TimescaleDB must be preloaded at server start. The image only auto-configures
    # this on a fresh initdb; an existing data volume keeps shared_preload_libraries
    # empty, so we set it explicitly here (required before CREATE EXTENSION).
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
    environment:
      POSTGRES_USER: supervisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supervisor}
      POSTGRES_DB: serversupervisor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervisor -d serversupervisor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ServerSupervisor Server (API + Frontend)
  server:
    # Pre-built, multi-arch, cosign-signed image published by .github/workflows/release.yml.
    # Override SERVERSUPERVISOR_IMAGE/SERVERSUPERVISOR_VERSION in .env to pin a specific
    # release or point at a private mirror; building from source is only needed for local
    # development (see CONTRIBUTING.md) or docker-compose.demo.yml.
    image: ${SERVERSUPERVISOR_IMAGE:-ghcr.io/rem7474/serversupervisor}:${SERVERSUPERVISOR_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Server
      SERVER_PORT: "8080"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Timezone used to interpret Global Scheduled Tasks' cron expressions and
      # compute their "next run" times. Standard Go/tzdata name, e.g.
      # Europe/Paris. Unset defaults the container to UTC, which silently
      # offsets every schedule from what a non-UTC user typed into the cron
      # builder.
      TZ: ${TZ:-UTC}

      # Proxies
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: supervisor
      DB_PASSWORD: ${DB_PASSWORD:-supervisor}
      DB_NAME: serversupervisor
      DB_SSLMODE: disable
      
      # Authentication
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-168h}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      
      # Rate Limiting
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      
      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_POLL_INTERVAL: ${GITHUB_POLL_INTERVAL:-15m}
      
      # Alerts
      NOTIFY_URL: ${NOTIFY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      
      # Metrics
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy

  # Scheduled logical backups (pg_dump, gzip, rotation) of the ServerSupervisor
  # database. This is disaster recovery, not the TimescaleDB retention/compression
  # policies configured in migrations — those expire old data, this protects
  # against volume loss/corruption. See README.md "Sauvegarde & restauration"
  # for the restore procedure; test it before you need it in production.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: serversupervisor
      POSTGRES_USER: supervisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supervisor}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backups:
