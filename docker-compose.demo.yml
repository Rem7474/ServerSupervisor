# Demo mode — a fixed, realistic fake fleet for local visual QA / dev, and
# for the release screenshot pipeline (.github/workflows/screenshots.yml).
# Fully isolated from the production docker-compose.yml stack: its own
# project name/volumes/ports, and DEMO_MODE=true disables every poller that
# would otherwise make a real outbound network call (Proxmox VE, Nginx Proxy
# Manager, uptime/SSL probes, Git release tracking) — see server/CLAUDE.md and
# CONTRIBUTING.md's "Mode démo" section for the full local dev workflow.
#
# Reset: the cheapest reset is just re-running the seed binary — it's
# idempotent and brings every table back to its canonical demo state without
# touching the volume. For a hard reset (e.g. after manually deleting
# something via the UI):
#   docker compose -f docker-compose.demo.yml down -v
#   docker compose -f docker-compose.demo.yml up -d --build
#   docker compose -f docker-compose.demo.yml exec server-demo /app/seed-demo

name: serversupervisor-demo

services:
  postgres-demo:
    image: timescale/timescaledb:2.27.2-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
    environment:
      POSTGRES_USER: supervisor
      POSTGRES_PASSWORD: supervisor
      POSTGRES_DB: serversupervisor
    ports:
      # Published (unlike the production compose file) so "go run ./cmd/server"
      # and "go run ./cmd/seed-demo" on the host can reach it directly — the
      # fast local dev loop documented in CONTRIBUTING.md. Non-default port to
      # avoid clashing with a real local Postgres.
      - "55432:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervisor -d serversupervisor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full pre-built stack (server + frontend in one image, same as production)
  # — used by the screenshots.yml CI workflow and for a final pre-release
  # check locally. Day-to-day backend development should run
  # "go run ./cmd/server" against postgres-demo instead (see CONTRIBUTING.md);
  # rebuilding this image on every change is too slow for that loop.
  server-demo:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      BASE_URL: http://localhost:8080
      APP_ENV: dev
      DEMO_MODE: "true"
      TZ: UTC

      DB_HOST: postgres-demo
      DB_PORT: "5432"
      DB_USER: supervisor
      DB_PASSWORD: supervisor
      DB_NAME: serversupervisor
      DB_SSLMODE: disable

      # Fixed, non-default, local-only credentials — avoids the
      # must_change_password forced-reset screen (see main.go: it only
      # triggers when ADMIN_PASSWORD is literally "admin").
      ADMIN_USER: demo
      ADMIN_PASSWORD: DemoPass123!

      # No external integrations configured — belt-and-suspenders alongside
      # the DEMO_MODE poller gate in main.go.
      GITHUB_TOKEN: ""
      NOTIFY_URL: ""
      SMTP_HOST: ""
    depends_on:
      postgres-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  demo_postgres_data:
