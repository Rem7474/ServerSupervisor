name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases: v1.2.3-beta.1

permissions:
  contents: write       # créer la GitHub Release et uploader les assets
  packages: write       # pousser sur ghcr.io

# Ne jamais annuler une release en cours (cancel-in-progress: false).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────
  # Extraction des métadonnées de version
  # ─────────────────────────────────────────
  meta:
    name: Version metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # nécessaire pour git log

      - name: Extract version info
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR (like every OCI registry) requires the repository path to be
      # lowercase; github.repository_owner preserves the account's actual
      # display case (e.g. "Rem7474"). docker/metadata-action lowercases
      # internally so the build+push step below is fine either way, but
      # cosign's reference parser is stricter and rejects mixed case
      # outright — compute the lowercase reference once here so every job
      # (sign, release notes) uses the same value the image actually landed
      # at, instead of each re-deriving it from the raw owner name.
      - name: Compute lowercase image reference
        id: image
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}/serversupervisor' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Séparateur de ligne réel (bash $'...' évite les \n littéraux)
          NL=$'\n'

          # Générer changelog groupé par type (feat, fix, etc.)
          CHANGELOG=""

          # Features
          FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges --grep="^feat" | head -20)
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### ✨ Features${NL}${FEATURES}${NL}"
          fi

          # Fixes
          FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges --grep="^fix" | head -20)
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes${NL}${FIXES}${NL}"
          fi

          # Other changes
          OTHERS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges --grep="^chore\|^refactor\|^perf" | head -10)
          if [ -n "$OTHERS" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 Other Changes${NL}${OTHERS}${NL}"
          fi

          # Supprimer les lignes vides en double éventuelles
          CHANGELOG=$(echo "$CHANGELOG" | sed '/^$/{ N; /^\n$/d }')

          # Définir la sortie GitHub Actions en multi-lignes (évite les encodages %0A)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────
  # Binaires agent multi-plateforme
  # ─────────────────────────────────────────
  agent-binaries:
    name: Agent binaries
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      id-token: write   # required for keyless cosign signing (Sigstore/GitHub OIDC)

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goos: linux
            goarch: arm
            goarm: "6"
            suffix: linux-armv6

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build agent binary
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "agent-${{ matrix.suffix }}" \
            ./cmd/agent

      - name: Compress binary
        working-directory: agent
        run: |
          gzip -k "agent-${{ matrix.suffix }}"
          sha256sum "agent-${{ matrix.suffix }}.gz" > "agent-${{ matrix.suffix }}.gz.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: cosign requests a short-lived certificate from Sigstore's
      # Fulcio CA using this job's GitHub OIDC token (no signing key to provision or
      # leak). The sha256 sidecar above already guards against download corruption;
      # this additionally proves the blob came from this exact repo + workflow.
      - name: Sign agent binary (keyless, Sigstore)
        working-directory: agent
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --output-signature "agent-${{ matrix.suffix }}.gz.sig" \
            --output-certificate "agent-${{ matrix.suffix }}.gz.pem" \
            "agent-${{ matrix.suffix }}.gz"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.suffix }}
          path: |
            agent/agent-${{ matrix.suffix }}.gz
            agent/agent-${{ matrix.suffix }}.gz.sha256
            agent/agent-${{ matrix.suffix }}.gz.sig
            agent/agent-${{ matrix.suffix }}.gz.pem
          retention-days: 1

  # ─────────────────────────────────────────
  # Image Docker serveur multi-arch (amd64 + arm64)
  # ─────────────────────────────────────────
  docker-server:
    name: Docker server image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write    # push to GHCR
      id-token: write    # required for keyless cosign signing (Sigstore/GitHub OIDC)

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.meta.outputs.is_prerelease == 'false' }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations pushed alongside the image to GHCR.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via Sigstore/Fulcio using this job's GitHub OIDC token — no
      # signing key to provision or leak. Signs the immutable digest (not a mutable
      # tag), matching provenance/SBOM already attached above.
      - name: Sign server image (keyless, Sigstore)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ needs.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  # ─────────────────────────────────────────
  # GitHub Release avec tous les assets
  # ─────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, agent-binaries, docker-server]

    steps:
      - name: Download all agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: ./release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ServerSupervisor v${{ needs.meta.outputs.version }}"
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## ServerSupervisor v${{ needs.meta.outputs.version }}

            ### 🐳 Image Docker

            **Serveur** (inclut frontend intégré) :
            ```bash
            docker pull ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ```

            ### 📦 Binaires agent

            L'agent doit tourner **nativement** sur le système supervisé (accès à `docker`, `apt`, etc.).

            | Plateforme | Fichier |
            |-----------|---------|
            | Linux x86_64 | `agent-linux-amd64.gz` |
            | Linux ARM 64-bit | `agent-linux-arm64.gz` |
            | Linux ARM 32-bit v7 (Raspberry Pi) | `agent-linux-armv7.gz` |
            | Linux ARM 32-bit v6 | `agent-linux-armv6.gz` |

            **Installation rapide :**
            ```bash
            # Remplacer ARCH par: amd64, arm64, armv7, armv6
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/agent-linux-ARCH.gz | \
              gunzip > /usr/local/bin/serversupervisor-agent
            chmod +x /usr/local/bin/serversupervisor-agent
            ```

            **Vérifier l'intégrité :**
            ```bash
            sha256sum -c agent-linux-ARCH.gz.sha256
            ```

            ### 🔏 Vérifier la provenance (binaires + image Docker)

            Les binaires et l'image Docker sont signés de façon "keyless" via
            [Sigstore](https://www.sigstore.dev/) (certificat éphémère émis par le
            fournisseur d'identité OIDC de GitHub Actions pour ce dépôt/workflow
            précis — pas de clé de signature à gérer). Nécessite
            [cosign](https://docs.sigstore.dev/cosign/installation/).

            ```bash
            # Binaire agent (remplacer ARCH par: amd64, arm64, armv7, armv6)
            cosign verify-blob \
              --certificate agent-linux-ARCH.gz.pem \
              --signature agent-linux-ARCH.gz.sig \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              agent-linux-ARCH.gz

            # Image Docker serveur
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ```

            ### 📝 Changelog

            ${{ needs.meta.outputs.changelog }}
          files: |
            ./release-assets/*.gz
            ./release-assets/*.sha256
            ./release-assets/*.sig
            ./release-assets/*.pem
