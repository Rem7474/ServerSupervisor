name: Security

on:
  schedule:
    - cron: '0 6 * * 1'    # chaque lundi à 6h UTC
  push:
    branches: [main]
    paths:
      - 'server/go.mod'
      - 'server/go.sum'
      - 'agent/go.mod'
      - 'agent/go.sum'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '**/Dockerfile'
  pull_request:
    paths:
      - 'server/go.mod'
      - 'server/go.sum'
      - 'agent/go.mod'
      - 'agent/go.sum'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '**/Dockerfile'
  workflow_dispatch:        # déclenchable manuellement depuis l'UI GitHub

permissions:
  contents: read
  security-events: write    # upload SARIF vers GitHub Security tab

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Vulnérabilités Go - govulncheck (officiel Google)
  # ─────────────────────────────────────────
  govulncheck-server:
    name: govulncheck (server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        working-directory: server
        run: govulncheck ./...

  govulncheck-agent:
    name: govulncheck (agent)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        working-directory: agent
        run: govulncheck ./...

  # ─────────────────────────────────────────
  # Nancy - CVE dans les dépendances Go
  # ─────────────────────────────────────────
  nancy-server:
    name: nancy (server)
    runs-on: ubuntu-latest
    environment: Action
    # GitHub withholds repo/environment secrets from Dependabot's own
    # pull_request events (same restriction that made SonarQube Scan fail on
    # #304 — see #306) — OSS_INDEX_USER/TOKEN resolve empty and nancy fails
    # every time with a 401 that carries no real signal. Skip rather than
    # fail; the weekly schedule run and non-Dependabot PRs still cover this.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install nancy
        run: curl -L -o nancy https://github.com/sonatype-nexus-community/nancy/releases/download/v1.2.0/nancy-v1.2.0-linux-amd64 && chmod +x nancy

      - name: Run nancy
        working-directory: server
        run: go list -json -deps ./... | ../nancy sleuth --quiet --username "${{ secrets.OSS_INDEX_USER }}" --token "${{ secrets.OSS_INDEX_TOKEN }}"

  nancy-agent:
    name: nancy (agent)
    runs-on: ubuntu-latest
    environment: Action
    # See nancy-server above.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install nancy
        run: curl -L -o nancy https://github.com/sonatype-nexus-community/nancy/releases/download/v1.2.0/nancy-v1.2.0-linux-amd64 && chmod +x nancy

      - name: Run nancy
        working-directory: agent
        run: go list -json -deps ./... | ../nancy sleuth --quiet --username "${{ secrets.OSS_INDEX_USER }}" --token "${{ secrets.OSS_INDEX_TOKEN }}"

  # ─────────────────────────────────────────
  # Audit npm
  # ─────────────────────────────────────────
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        # --audit-level=moderate : échouer sur moderate/high/critical
        run: npm audit --audit-level=moderate

  # ─────────────────────────────────────────
  # Scan Trivy - image Docker serveur
  # ─────────────────────────────────────────
  trivy-server:
    name: Trivy scan (server image)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: serversupervisor-server:scan
          cache-from: type=gha,scope=server-trivy
          cache-to: type=gha,mode=max,scope=server-trivy

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: serversupervisor-server:scan
          format: sarif
          output: trivy-server.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'    # bloquant : ROADMAP.md item #7
          trivyignores: .trivyignore

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-server.sarif
          category: trivy-server
