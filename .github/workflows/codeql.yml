name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1'    # chaque lundi à 6h UTC
  workflow_dispatch:        # déclenchable manuellement depuis l'UI GitHub

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Scan du code source (CodeQL)
  # ─────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # Go dropped support for build-mode: none on current CodeQL CLI/Action
      # versions (only autobuild/manual remain) — manual + an explicit build
      # of both modules covers server/ + agent/ in one pass, same coverage
      # build-mode: none used to give without needing a go.work at the root
      # (which would change dependency resolution for every other Go command
      # run from a subdirectory, not just CodeQL).
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      # server/ and agent/ are independent Go modules that can each bump their
      # own `go` directive independently (e.g. a Dependabot update running `go
      # mod tidy` on just one of them) — go-version-file can only point at one
      # file, so pick whichever module currently requires the higher version
      # instead of hardcoding server/go.mod and silently breaking the Go build
      # below whenever agent/ (or vice versa) moves ahead.
      - name: Determine Go version (max across server/ and agent/ go.mod)
        if: matrix.language == 'go'
        id: goversion
        run: |
          SERVER_GO=$(grep -m1 '^go ' server/go.mod | awk '{print $2}')
          AGENT_GO=$(grep -m1 '^go ' agent/go.mod | awk '{print $2}')
          MAX_GO=$(printf '%s\n%s\n' "$SERVER_GO" "$AGENT_GO" | sort -V | tail -1)
          echo "version=$MAX_GO" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Règles supplémentaires pour la sécurité web
          queries: security-extended

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd server && go build ./...)
          (cd agent && go build ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}
