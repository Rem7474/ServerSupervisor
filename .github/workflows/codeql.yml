name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1'    # chaque lundi à 6h UTC
  workflow_dispatch:        # déclenchable manuellement depuis l'UI GitHub

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Scan du code source (CodeQL)
  # ─────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # Go dropped support for build-mode: none on current CodeQL CLI/Action
      # versions (only autobuild/manual remain) — manual + an explicit build
      # of both modules covers server/ + agent/ in one pass, same coverage
      # build-mode: none used to give without needing a go.work at the root
      # (which would change dependency resolution for every other Go command
      # run from a subdirectory, not just CodeQL).
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Règles supplémentaires pour la sécurité web
          queries: security-extended

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd server && go build ./...)
          (cd agent && go build ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}
