name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent/**'
      - 'frontend/**'
      - '!**/*.md'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1'    # chaque lundi à 6h UTC
  workflow_dispatch:        # déclenchable manuellement depuis l'UI GitHub

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Scan du code source (CodeQL)
  # ─────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # build-mode: none analyse la source directement. Pour Go, cela couvre les
      # DEUX modules (server/ + agent/) en une seule passe — ce que autobuild
      # manquait faute de go.work à la racine (l'agent échappait au scan).
      matrix:
        include:
          - language: go
            build-mode: none
          - language: javascript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Règles supplémentaires pour la sécurité web
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}
