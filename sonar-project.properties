sonar.projectKey=Rem7474_ServerSupervisor
sonar.organization=rem7474
sonar.projectName=ServerSupervisor
sonar.sourceEncoding=UTF-8

# Three independent modules (see CLAUDE.md) analyzed from one scan.
sonar.sources=server/cmd,server/internal,agent/cmd,agent/internal,frontend/src

# *_test.go being auto-detected only means Sonar's Go rules skip them for
# static analysis — it does NOT exempt their lines from the new-code coverage
# gate (confirmed: a *_test.go file's own added lines showed up as 0%-covered
# "new code to cover", since go test's coverage.out never instruments test
# files themselves). sonar.test.inclusions is what actually does that, so Go
# test files need to be listed here too, not just frontend's co-located specs
# (frontend/CLAUDE.md: "*.spec.ts co-located") — sonar.tests overlaps
# sonar.sources for both reasons.
sonar.tests=frontend/src,server,agent
sonar.test.inclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.browser.test.ts,server/**/*_test.go,agent/**/*_test.go

# Generated/vendored/build output — not authored code.
sonar.exclusions=\
  frontend/src/types/generated.ts,\
  server/internal/database/migrations/**,\
  agent/build/**,\
  agent/bin/**,\
  server/bin/**

# Go coverage: native `go test -coverprofile` format, one file per module.
sonar.go.coverage.reportPaths=server/coverage.out,agent/coverage.out
# Frontend coverage: lcov from `npm run test:coverage` (happy-dom, Vitest +
# @vitest/coverage-v8) plus `npm run test:browser:coverage` (Playwright/Chromium,
# for ApexCharts/D3 rendering happy-dom can't exercise) — SonarCloud merges
# per-file hit counts across both report paths.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,frontend/coverage-browser/lcov.info
