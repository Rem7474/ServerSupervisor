sonar.projectKey=Rem7474_ServerSupervisor
sonar.organization=rem7474
sonar.projectName=ServerSupervisor
sonar.sourceEncoding=UTF-8

# Three independent modules (see CLAUDE.md) analyzed from one scan.
sonar.sources=server/cmd,server/internal,agent/cmd,agent/internal,frontend/src

# Go test files are auto-detected by the *_test.go suffix, no separate
# sonar.tests entry needed for server/agent. Frontend specs are co-located
# with their source (frontend/CLAUDE.md: "*.spec.ts co-located") rather than
# in a separate directory, so sonar.tests overlaps sonar.sources and
# sonar.test.inclusions is what actually tells Sonar which files are tests.
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/*.spec.ts

# Generated/vendored/build output — not authored code.
sonar.exclusions=\
  frontend/src/types/generated.ts,\
  server/internal/database/migrations/**,\
  agent/build/**,\
  agent/bin/**,\
  server/bin/**

# Go coverage: native `go test -coverprofile` format, one file per module.
sonar.go.coverage.reportPaths=server/coverage.out,agent/coverage.out
# Frontend coverage: lcov from `npm run test:coverage` (Vitest + @vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
